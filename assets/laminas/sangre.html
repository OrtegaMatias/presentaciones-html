<!-- A SANGRE · manifiesto o portada de concepto: degradado del tema, textura y tipografía display. Una idea, sin tarjetas.
     Al entrar: la primera línea entra letra a letra y la segunda se descubre con un barrido.
     EDITAR: frases, lema; textura (puntos · lineas · cruces · ondas · red, + desvanece o desvanece-izq).
     Variante clara para proyector con luz: class="slide bruma" (mismo contenido, fondo claro). -->
<section class="slide sangre" id="s-sangre" data-titulo="Las fallas no avisan; los datos sí" data-ruta="Inicio" data-plantilla>
  <div class="textura red desvanece"></div>
  <div class="cuerpo">
    <p class="display m letras">Las fallas no avisan.</p>
    <p class="display m barrido" style="color:var(--accent);animation-delay:1.1s">Los datos, sí.</p>
    <p class="lema mt-l rise" style="--i:12">Seis fresadoras ya registran torque, temperatura y vibración cada minuto. Nadie lo está leyendo todavía.</p>
  </div>
  <aside class="notas">Dejar que la frase se arme sola. Pausa. Recién entonces leer el lema.</aside>
</section>
